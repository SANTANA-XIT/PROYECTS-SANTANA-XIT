name: Build PWA to iOS Wrapper
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Prepare Web Bundle
        run: |
          mkdir -p ios-output
          cp -r index.html manifest.json icon.png assets ios-output/ || cp -r * ios-output/
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Santana-XIT-iOS
          path: ios-output/
